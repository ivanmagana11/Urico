<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>úricoimm · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"LEMON MILK Bold";src:url("https://framerusercontent.com/assets/VcBvl2ZCH2kJERypJ3LDoieOY.woff2") format("woff2");font-display:swap;font-style:normal;font-weight:700}
:root{--bg:#f9ede2;--ink:#040404;--ink2:#100c30;--magenta:#f70088;--cyan:#29b6e8;--yellow:#ffd400;--pink:#ff87e1;--rojo:#e40039;--body:Poppins,system-ui,sans-serif;--display:"LEMON MILK Bold",Poppins,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink2);font-family:var(--body);font-weight:500}
.card{width:100%;max-width:400px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink2);padding:30px 26px}
.badge{display:inline-block;background:var(--pink);color:var(--ink2);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink2);border-radius:100px;padding:6px 14px;margin-bottom:14px;font-family:var(--display);font-size:12px;letter-spacing:.4px;text-transform:uppercase}
h1{font-family:var(--display);text-transform:uppercase;letter-spacing:.5px;font-size:34px;line-height:.95;margin:0 0 6px}
.logo{display:block;max-width:100%;height:auto;margin:0 0 6px}
p.sub{margin:0 0 22px;font-size:14px;line-height:1.5;opacity:.85}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input{width:100%;padding:12px 16px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink2);font:inherit;font-weight:600;box-shadow:3px 3px 0 color-mix(in srgb,var(--ink2) 22%, transparent)}
input:focus{outline:none;box-shadow:3px 3px 0 var(--magenta)}
button{--s:4px;width:100%;margin-top:22px;cursor:pointer;background:var(--magenta);color:#fff;border:3px solid var(--ink);border-radius:100px;padding:13px 28px;min-height:50px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.5px;box-shadow:var(--s) var(--s) 0 var(--ink2);transition:transform .08s ease,box-shadow .08s ease}
button:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink2)}
button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink2)}
.error{margin-top:16px;padding:10px 14px;border:3px solid var(--ink);border-radius:12px;background:color-mix(in srgb,var(--rojo) 18%, #fff);box-shadow:3px 3px 0 var(--ink2);font-size:13px;font-weight:600}
.foot{margin-top:18px;font-size:11.5px;line-height:1.5;color:color-mix(in srgb,var(--ink2) 60%, transparent);text-align:center}
</style></head>
<body>
<form class="card" method="post" action="/login" autocomplete="off">
 <span class="badge">Acceso restringido</span>
 <h1><img class="logo" src="/img/logo.png" alt="úricoimm" width="1536" height="1024"></h1>
 <p class="sub">Panel de administración. Introduce tus credenciales.</p>
 <label for="usuario">Usuario</label>
 <input id="usuario" name="usuario" type="text" required autofocus autocomplete="username">
 <label for="password">Contraseña</label>
 <input id="password" name="password" type="password" required autocomplete="current-password">
 <button type="submit">Entrar</button>
 {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
 <div class="foot">Esta página no es accesible desde el sitio público.</div>
</form>
</body></html>
